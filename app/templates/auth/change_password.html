{% extends "base.html" %}
{% block title %}Đổi mật khẩu - Hệ thống Điểm danh{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-11 col-sm-9 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-4 fw-bold">Đổi mật khẩu</h4>
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Mật khẩu hiện tại</label>
            <input type="password" name="old_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu mới (tối thiểu 6 ký tự)</label>
            <input type="password" name="new_password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nhập lại mật khẩu mới</label>
            <input type="password" name="confirm_password" class="form-control" minlength="6" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">Lưu</button>
            <a href="/" class="btn btn-outline-secondary">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
